<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — История России</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

  <!-- Карточка авторизации -->
  <div class="auth-card">
    
    <!-- Логотип / Заголовок -->
    <h1 class="auth-logo">📜 История России</h1>

    <!-- Кнопки переключения (Вкладки) -->
    <div class="auth-tabs">
      <button class="tab active" id="tabLogin">Вход</button>
      <button class="tab" id="tabRegister">Регистрация</button>
    </div>

    <!-- ФОРМА ВХОДА -->
    <form id="loginForm" class="auth-form active">
      <div class="input-group">
        <label for="loginUsername">Логин</label>
        <input type="text" id="loginUsername" name="username" placeholder="Введите ваш логин" required>
      </div>

      <div class="input-group">
        <label for="loginPassword">Пароль</label>
        <div class="input-wrapper">
          <!-- Исправлено: id="loginPassword" -->
          <input type="password" id="loginPassword" name="password" placeholder="Больше 8 символов" required>
          <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn-primary">Войти</button>
      
      <!-- Блок для вывода ошибок -->
      <p class="auth-error" id="loginError"></p>
    </form>

    <!-- ФОРМА РЕГИСТРАЦИИ -->
    <form id="registerForm" class="auth-form">
      <div class="input-group">
        <label for="regUsername">Логин</label>
        <input type="text" id="regUsername" name="username" placeholder="Придумайте логин" required>
      </div>

      <div class="input-group">
        <label for="regEmail">Email</label>
        <input type="email" id="regEmail" name="email" placeholder="ivan@mail.ru" required>
      </div>

      <!-- Поле пароля 1 -->
      <div class="input-group">
        <label for="regPassword">Пароль</label>
        <div class="input-wrapper">
          <!-- Исправлено: id="regPassword" -->
          <input type="password" id="regPassword" name="password" placeholder="Больше 8 символов" required>
          <button type="button" class="toggle-password" onclick="togglePassword('regPassword', this)">👁️</button>
        </div>
      </div>

      <!-- Поле пароля 2 (повтор) -->
      <div class="input-group">
        <label for="regPassword2">Повторите пароль</label>
        <div class="input-wrapper">
          <input type="password" id="regPassword2" name="password2" placeholder="••••••••" required>
          <button type="button" class="toggle-password" onclick="togglePassword('regPassword2', this)">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn-primary">Зарегистрироваться</button>
      
      <p class="auth-error" id="registerError"></p>
    </form>

  </div>

  <script src="js/auth_user.js"></script>
</body>
</html>
